# Cerno Workflow Mappings
#
# Maps namespaced finding IDs to verification workflow steps.
# These workflows are display-only and provide structured guidance
# for verifying specific vulnerabilities.
#
# Format:
#   finding_id: Single ID ("nessus:57608") or comma-separated
#               ("nessus:57608,nessus:10079,nuclei:apache-detect"). Every id
#               carries its source prefix; a bare number does not load.
#   workflow_name: Human-readable name for the workflow
#   description: Brief description of what is being verified
#   steps: List of verification steps with commands and notes
#   references: List of reference URLs
# 
  # - finding_id: ""
  #   workflow_name: ""
  #   description: ""
  #   steps:
  #     - title: ""
  #       commands:
  #         - ""
  #       notes: ""

  #   references:
  #     - ""

version: "1.0"

workflows:
  - finding_id: "nessus:40984"
    workflow_name: "Investigate Browsable Web Directories"
    description: "Check for any filenames and content with confidential data."
    steps:
      - title: "Use wget to recursively download the contents of the browsable web directories and their subfolders"
        commands:
          - "wget -nc -r -l inf -i browsable.urls"
        
      - title: "Dig through the content with Trufflehog"
        commands:
          - "trufflehog filesystem --json \"browsable\" browsable | tee trufflehog.json"

    references:
      - "https://www.tenable.com/plugins/nessus/40984"
      - "https://www.blackhillsinfosec.com/rooting-for-secrets-with-trufflehog/"

  - finding_id: "nessus:10759"
    workflow_name: "Web Server HTTP Header Internal IP Disclosure"
    description: "Occurs when a web server includes internal IP addresses in HTTP response headers, unintentionally exposing internal network details that can aid attackers in mapping or targeting internal infrastructure."
    steps:
      - title: "Try with NSE script"
        commands:
          - "sudo nmap --script http-internal-ip-disclosure --script-args http-internal-ip-disclosure.path=/ <TARGET> -p <PORT>"
        notes: ""

      - title: "Use Burp's Repeater"
        commands:
          - "Manually build and run a request using Burp's repeater"
        notes: "Manually exploit this via Burps Repeater functionality and forced the use of HTTP/1.0 without a Host header defined."

    references:
      - "https://www.tenable.com/plugins/nessus/10759"

  # SMB Signing Not Required (nessus:57608)
  - finding_id: "nessus:57608"
    workflow_name: "SMB Signing Not Required"
    description: "Remote SMB server does not enforce message signing"
    steps:
      - title: "Verify SMB signing is disabled"
        commands:
          - "netexec smb <TARGET> -u <USERNAME> -p <PASSWORD>"
          - "nmap -p445 --script smb-security-mode <TARGET>"
        notes: "Check output for 'Message signing: disabled' or similar"

      - title: "Test NTLM relay attack feasibility"
        commands:
          - "responder -I <INTERFACE> -A"
          - "ntlmrelayx.py -tf targets.txt -smb2support"
        notes: "Attempt to relay captured NTLM authentication"

      - title: "Enumerate accessible shares"
        commands:
          - "netexec smb <TARGET> -u <USERNAME> -p <PASSWORD> --shares"
          - "smbclient -L //<TARGET> -U <USERNAME>"
        notes: "List available SMB shares and permissions"

    references:
      - "https://www.tenable.com/plugins/nessus/57608"
      - "https://attack.mitre.org/techniques/T1557/001/"

  - finding_id: "nessus:10114"
    workflow_name: "ICMP Timestamp Request Remote Date Disclosure"
    description: "Occurs when a system responds to ICMP timestamp requests with its local time, allowing remote attackers to infer the device’s timezone, system clock, and potentially aiding in reconnaissance or timing attacks."
    steps:
      - title: "Check request and response types"
        commands:
          - "sudo hping3 <TARGET> --icmp --icmp-ts -V -c 3"
        notes: "You're looking to see if the ICMP timestamp request was coded as message type 13 and the subsequent timestamp response was coded as message type 14. Confirmed = 'ICMP timestamp: Originate=... Receive=... Transmit=...' lines in the replies. External network tests: run from a clean external source (e.g. a cloud VPS) rather than a corporate or VPN egress, because middleboxes on the tester's own path can drop or answer ICMP and give a false negative. Internal network tests: running from the implant or testing machine on the internal network is normally fine, since there is no tester-side egress in the path. No reply from one source is 'unable', not false positive - retest from another source or from the scanner's IP."

      - title: "Convert the hping3 ICMP timestamp response into human readable time using https://github.com/DefensiveOrigins/icmp-timestamp."
        commands:
          - "bash icmp-timestamp.sh -O <Originate timestamp> -R <Receive timestamp> -T <Transmit timestamp>"
        notes: "The values are milliseconds since midnight UTC (RFC 792), so Receive/1000 gives seconds into the UTC day (e.g. 43200000 = 12:00:00.000 UTC). Receive minus Originate, compared with RTT/2, shows the remote clock offset: about RTT/2 means the clock is synchronized with yours; a large or constant offset means clock skew or a non-UTC clock. A high bit set or wildly wrong values mean the device does not report standard time; it still discloses a timestamp. Note: the script's 'RTT' line is Transmit minus Originate (timestamp arithmetic, which includes any clock offset), not the network round-trip time - use hping3's 'rtt=' value for the real RTT."

      - title: "Query and decode in one step with timecheck (multi-host, CSV output)"
        commands:
          - "pipx install git+https://github.com/DefensiveOrigins/icmp-timestamp"
          - "sudo bash -c \"$(command -v timecheck) --verbose --csv icmp-timestamp.csv <(echo <TARGET>)\""
        notes: "timecheck sends ICMP Timestamp requests and reports each host's remote UTC time and NTP-style offset vs your clock. STATUS OK/HIGH with a REMOTE TIME = confirmed (the host disclosed its clock); a failed host = no reply, so treat it as 'unable' and retest per step 1. --verbose shows raw T1-T4 values for the report. Why the wrapper: $(command -v timecheck) resolves the full path before sudo, because pipx installs to the user's ~/.local/bin, which is not on sudo's secure_path. bash -c keeps the <(echo ...) substitution inside the root shell, because sudo closes inherited file descriptors. For many hosts: sudo \"$(command -v timecheck)\" --verbose --csv icmp-timestamp.csv hosts.txt (one IP per line). As root, plain 'timecheck hosts.txt' works. Its RTT includes tool overhead and can read higher than hping3's rtt=. Needs raw-socket privileges (root/sudo)."

      - title: "Check that the reply comes from the target, not a middlebox"
        commands:
          - "ping -c 3 -W 2 <TARGET>"
        notes: "Compare the echo-reply TTL with the timestamp-reply TTL from step 1. Similar TTLs (e.g. both near 255-n or both near 128-n) mean the same device answered both. A big mismatch, or an echo TTL of exactly 64/128/255 from a host many hops away, suggests something on your own path (NAT, VPN, firewall) is answering or filtering ICMP. In that case trust the run from a clean source - on an external test, a cloud VPS; on an internal test this mismatch is rare, but if it happens, check for a host firewall or segmentation device between the implant and the target."

      - title: "Fallback without hping3"
        commands:
          - "sudo nmap -sn -PP -n --reason --packet-trace <TARGET>"
        notes: "-PP sends ICMP timestamp requests only. 'Host is up, received timestamp-reply' = confirmed; it does not print the timestamp values, so use hping3 (step 1) or timecheck --verbose (step 3) for report evidence."

    references:
      - "https://www.tenable.com/plugins/nessus/10114"
      - "https://github.com/DefensiveOrigins/icmp-timestamp"
      - "https://datatracker.ietf.org/doc/html/rfc792"

  - finding_id: "nessus:41028"
    workflow_name: "SNMP Default Community Strings"
    description: "Default SNMP community string usage could allow for configuration read through SNMP queries and possibly a full SNMP MIB tree walk."
    steps:
      - title: "Enumerate SNMP info against the internal scope"
        commands:
          - "sudo nmap -sU -sV -p161 -T4 --script \"snmp* and not snmp-brute\" <TARGET>"
      
      - title: "Specifically use snmp-brute to verify this issue and to check for additional commonly used SNMP community strings"
        commands:
          - "sudo nmap -sU -sV -p161 -T4 --script snmp-brute <TARGET>"

      - title: "Also available to use..."
        commands:
          - "msfconsole -q -x 'use auxiliary/scanner/snmp/snmp_login'"
          - "https://github.com/trailofbits/onesixtyone"
          - "https://github.com/net-snmp/net-snmp"

    references:
      - "https://www.tenable.com/plugins/nessus/41028"
      - "https://www.blackhillsinfosec.com/snmp-strings-attached/"
      - "https://github.com/trailofbits/onesixtyone"
      - "https://github.com/net-snmp/net-snmp"

  - finding_id: "nessus:20007,nessus:26928,nessus:31705,nessus:42873,nessus:65821,nessus:78479,nessus:81606,nessus:83738,nessus:83875,nessus:89058,nessus:104743,nessus:157288"
    workflow_name: "Weak SSL/TLS Configurations"
    description: "Weak or deprecated SSL/TLS configurations — including outdated protocol versions, weak/anonymous/export cipher suites, and exploitable vulnerabilities — should be remediated."
    steps:
      - title: "Enumerate the supported encryption protocol versions and cipher suites."
        commands:
          - "sudo nmap -A --script=ssl-enum-ciphers,ssl-cert,ssl-date <TARGET>"
        notes: "SSLv2, SSLv3, TLSv1.0, and TLSv1.1 are deprecated and should be disabled. Weak/medium-strength, anonymous, and EXPORT cipher suites must be removed. Check for specific vulnerabilities: POODLE (nessus:78479) exploits SSLv3 CBC padding; FREAK (nessus:65821, nessus:83875) and Logjam (nessus:81606, nessus:83738, nessus:89058) exploit weak EXPORT key exchange. Prefer TLSv1.2+ with strong cipher suites only."

    references:
      - "https://www.tenable.com/plugins/nessus/20007"
      - "https://www.tenable.com/plugins/nessus/26928"
      - "https://www.tenable.com/plugins/nessus/31705"
      - "https://www.tenable.com/plugins/nessus/42873"
      - "https://www.tenable.com/plugins/nessus/65821"
      - "https://www.tenable.com/plugins/nessus/78479"
      - "https://www.tenable.com/plugins/nessus/81606"
      - "https://www.tenable.com/plugins/nessus/83738"
      - "https://www.tenable.com/plugins/nessus/83875"
      - "https://www.tenable.com/plugins/nessus/89058"
      - "https://www.tenable.com/plugins/nessus/104743"
      - "https://www.tenable.com/plugins/nessus/157288"
      - "https://www.blackhillsinfosec.com/testing-tls-and-certificates/"

  - finding_id: "nessus:42263"
    workflow_name: "Unencrypted Telnet Server"
    description: "The primary risk posed by unencrypted network protocols is that an attacker can eavesdrop on communication and extract any information in it, such as confidential data and credentials."
    steps:
      - title: "Verify Telnet usage."
        commands:
          - "sudo nmap -A -p 23 <TARGET>"

      - title: "Intercept cleartext traffic for proof-of-concept."
        commands:
          - "tcpdump tcp port 23 and dst <TARGET> and src 0.0.0.0 -i eth0 -w telnet.pcap -tttt"
          - "telnet <TARGET> 23"
        notes: "Start up tcpdump to capture packets then trigger a telnet connect. Enter any credentials you want. We're just trying to prove the capturing."

      - title: "Wireshark Analysis"
        notes: "Open the pcap file in Wireshark and find where the cleartext creds were captured. Screenshot it and put it in your report."

    references:
      - "https://www.tenable.com/plugins/nessus/42263"

  - finding_id: "nessus:187315"
    workflow_name: "Terrapin Weakness"
    description: "SSH vulnerability that could permit MITM style attacks"
    steps:
      - title: "Copy the POC Python script (https://github.com/ronf/asyncssh/security/advisories/GHSA-hfmc-7525-mj55)."

      - title: "In the POC script, replace the PROXY_IP variable with your systems IP on the network and replace the SERVER_IP variable with your target."

      - title: "Run the POC script & connect to the proxy server you started"
        commands:
          - "python terrapin-poc.py"
          - "ssh root@<TARGET> -p 2222"
        notes: "In the Python script output, a successful exploitation is evident when the two SSH output lines below are missing.\n\ndebug1: SSH2_MSG_EXT_INFO received\ndebug1: kex_input_ext_info: server-sig-algs=<rsa-sha2-256,rsa-sha2-512>"


    references:
      - "https://www.tenable.com/plugins/nessus/187315"
      - "https://github.com/ronf/asyncssh/security/advisories/GHSA-hfmc-7525-mj55"
      - "https://nvd.nist.gov/vuln/detail/CVE-2023-48795"
      - "https://terrapin-attack.com/"

  - finding_id: "nessus:90317,nessus:70658,nessus:153953,nessus:71049"
    workflow_name: "SSH Service Verification"
    description: "SSH service is accepting weak ciphers, key exchange algorithms, or MAC algorithms, and/or accepts password authentication. These misconfigurations can expose the service to brute force, MITM, or cryptographic downgrade attacks."
    steps:
      - title: "Enumerate SSH service version, supported algorithms, and accepted auth methods"
        commands:
          - "sudo nmap -p 22 --script ssh2-enum-algos,ssh-hostkey,sshv1,ssh-auth-methods <TARGET>"
        notes: "Look for CBC ciphers, weak KEX algorithms (diffie-hellman-group1-sha1, diffie-hellman-group14-sha1), weak MACs (hmac-md5, hmac-sha1-96), SSHv1 support, and accepted authentication methods (password, publickey, keyboard-interactive)."

      - title: "Run ssh-audit for a comprehensive algorithm audit"
        commands:
          - "ssh-audit <TARGET>"
          - "ssh-audit <TARGET> -p <PORT>"
        notes: "ssh-audit provides color-coded output for deprecated/weak algorithms. Available at https://github.com/jtesta/ssh-audit"

      - title: "Verify password authentication is accepted"
        commands:
          - "ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no <USERNAME>@<TARGET>"
          - "sudo nmap -p 22 --script ssh-brute --script-args userdb=users.txt,passdb=passwords.txt <TARGET>"
        notes: "Confirm that password auth is accepted (relevant to plugin 90317). Brute force only with explicit authorization."

      - title: "Check for additional weak configurations with Metasploit"
        commands:
          - "msfconsole -q -x 'use auxiliary/scanner/ssh/ssh_enumusers; set RHOSTS <TARGET>; run'"
        notes: "Optional: enumerate valid usernames if the service is vulnerable to user enumeration."

    references:
      - "https://www.tenable.com/plugins/nessus/90317"
      - "https://www.tenable.com/plugins/nessus/70658"
      - "https://www.tenable.com/plugins/nessus/153953"
      - "https://www.tenable.com/plugins/nessus/71049"
      - "https://github.com/jtesta/ssh-audit"
      - "https://attack.mitre.org/techniques/T1110/001/"

  - finding_id: "nessus:35297,nessus:91263"
    workflow_name: "SSL Service Requests Client Certificate"
    description: "Confirm the server sends a TLS CertificateRequest and determine whether a client certificate is optional or required."
    steps:
      - title: "Watch the TLS handshake for a CertificateRequest"
        commands:
          - "curl -skv -I https://<TARGET>:<PORT>/"
        notes: "In the verbose handshake output look for 'TLS handshake, Request CERT (13)'. Present = the server requests a client certificate (confirms this plugin). curl sends an empty Certificate (11) in reply. If the handshake then completes and an HTTP response comes back, the certificate is OPTIONAL - so plugin 91263 'Service Requires Client Certificate' on the same port is a false positive. If the handshake aborts with an alert (e.g. 'certificate required' / handshake failure) right after the empty certificate, it is REQUIRED."

      - title: "Confirm with openssl (works on any TLS service, incl. non-HTTP and TLS 1.3)"
        commands:
          - "echo | openssl s_client -connect <TARGET>:<PORT> -servername <TARGET>"
        notes: "Use this when the service is not HTTPS (e.g. SMTPS, LDAPS, IMAPS) or curl output is ambiguous. The echo closes stdin so s_client exits after the handshake. Look for 'Acceptable client certificate CA names' (followed by the CA list) - present = the server requested a client certificate; 'No client certificate CA names sent' = no request. s_client sends no certificate: if it still prints the server certificate and 'Verify return code' and stays connected, the certificate is OPTIONAL; if it ends with an alert such as 'certificate required' (TLS 1.3, alert 116) or 'handshake failure' (TLS 1.2, alert 40), it is REQUIRED. On TLS 1.3 the required-cert alert can arrive after the handshake summary, so read to the end of the output. Add -tls1_2 or -tls1_3 to test each version separately."

    references:
      - "https://www.tenable.com/plugins/nessus/35297"
      - "https://www.tenable.com/plugins/nessus/91263"

  - finding_id: "nessus:56984,nuclei:tls-version"
    workflow_name: "SSL / TLS Versions Supported"
    description: "Enumerate which SSL/TLS protocol versions the service accepts and flag any legacy versions (SSLv2/SSLv3/TLS 1.0/TLS 1.1)."
    steps:
      - title: "Enumerate supported protocol versions"
        commands:
          - "sslscan --no-colour <TARGET>:<PORT>"
        notes: "Read the 'SSL/TLS Protocols' block. Any of SSLv2, SSLv3, TLSv1.0 or TLSv1.1 showing 'enabled' is a reportable legacy-protocol issue (see the deprecated-protocol plugins). TLSv1.2/TLSv1.3 only = informational. Note whether TLSv1.3 is missing - worth mentioning, not a vuln on its own. The same output also covers cipher suites, key-exchange groups and the leaf certificate, so one run serves the related TLS inventory plugins."

      - title: "Alternative: enumerate protocols and grade ciphers with nmap"
        commands:
          - "nmap -Pn -p <PORT> --script ssl-enum-ciphers <TARGET>"
        notes: "Use when sslscan is unavailable or for graded output. Each protocol section lists its ciphers with a letter grade; any SSLv3/TLSv1.0/TLSv1.1 section, or a cipher graded below A (CBC, 3DES, RC4, non-PFS), is reportable. TLSv1.2/1.3 only with 'least strength: A' = nothing to report. For nuclei tls-version (which just lists the versions seen), this settles whether a legacy version is actually offered."

    references:
      - "https://www.tenable.com/plugins/nessus/56984"
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/ssl/tls-version.yaml"
      - "https://nmap.org/nsedoc/scripts/ssl-enum-ciphers.html"

  - finding_id: "nessus:95631"
    workflow_name: "SSL Certificate Signed Using Weak Hashing Algorithm (Known CA)"
    description: "Determine whether the weak (SHA-1/MD5) signature is on a certificate clients actually validate (leaf or intermediate) or only on a self-signed trust anchor."
    steps:
      - title: "Dump the full certificate chain the server sends"
        commands:
          - "sslscan --no-colour --show-certificates <TARGET>:<PORT>"
        notes: "For each certificate block, compare 'Signature Algorithm' with Subject/Issuer. Reportable: a leaf or intermediate (Subject != Issuer) signed with sha1WithRSA/md5. False positive: the only weak signature is on a self-signed root (Subject == Issuer, e.g. GlobalSign Root CA) - clients trust roots directly and never validate their self-signature. Also check whether the flagged root is still sent at all; CDNs (e.g. Cloudflare) rotate chains, and a cross-signed intermediate re-issued with SHA-256 replaces the old SHA-1 root."

    references:
      - "https://www.tenable.com/plugins/nessus/95631"

  - finding_id: "nessus:142960,nessus:84502,nuclei:weak-hsts-detect"
    workflow_name: "HSTS Missing From HTTPS Server (RFC 6797)"
    description: "Confirm whether HTTPS responses carry a Strict-Transport-Security header with an adequate max-age."
    steps:
      - title: "Check the HTTPS response for a Strict-Transport-Security header"
        commands:
          - "curl -sk --max-time 15 -D - https://<TARGET>:<PORT>/ | grep -i '^strict-transport-security'"
        notes: "No output = no HSTS header = confirmed. Also flag a header with max-age below 31536000 (1 year) or max-age=0. A header present with max-age >= 31536000 = false positive. Use a GET (as above) rather than -I, since some servers only add HSTS to GET responses. Check every HTTPS port Nessus listed - CDN alternate ports (2053/2083/2087/2096/8443) can behave differently from 443. An error or 404 response without HSTS still counts: browsers honour HSTS on any response sent over HTTPS. Reached from nuclei weak-hsts-detect: the template fires on a short max-age (and on a missing includeSubDomains), so the max-age threshold above settles it; note whether preload is present. The nuclei http-missing-security-headers template has its own workflow covering every header it checks."

    references:
      - "https://www.tenable.com/plugins/nessus/142960"
      - "https://www.tenable.com/plugins/nessus/84502"
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/misconfiguration/weak-hsts-detect.yaml"
      - "https://datatracker.ietf.org/doc/html/rfc6797"

  - finding_id: "nessus:298485"
    workflow_name: "Oracle E-Business Suite Detection"
    description: "Confirm Oracle EBS is really exposed, ruling out catch-all / soft-404 sites that answer every path the same way."
    steps:
      - title: "Compare EBS login paths against a random baseline path"
        commands:
          - "curl -skI --max-time 15 https://<TARGET>/OA_HTML/AppsLocalLogin.jsp"
          - "curl -skI --max-time 15 https://<TARGET>/OA_HTML/AppsLogin"
          - "curl -skI --max-time 15 https://<TARGET>/cerno-nonexistent-8f3a1c.jsp"
        notes: "Compare status code, Location and Content-Length. If the EBS paths return the same status/redirect/size as the random .jsp baseline, the site has a catch-all handler (common on WordPress/CDN sites) and the detection is a false positive. A real EBS instance usually redirects AppsLogin to an OA_HTML or SSO login page and sets Oracle session cookies (e.g. JSESSIONID, a cookie named after the database SID)."

      - title: "Check the page body for Oracle EBS markers"
        commands:
          - "curl -skL --max-time 20 https://<TARGET>/OA_HTML/AppsLocalLogin.jsp | grep -iE \"E-Business|Oracle Applications|OA_HTML|AppsLocalLogin\""
        notes: "Confirmed: the login page contains Oracle EBS branding or references to OA_HTML/OA_MEDIA resources. No matches, together with a baseline-identical response, means a false positive. If confirmed, record the EBS version from the page or headers and check it against current Oracle CPU advisories."

    references:
      - "https://www.tenable.com/plugins/nessus/298485"

  - finding_id: "nessus:304671"
    workflow_name: "nginx 1.3.0 < 1.28.2 / 1.29.x < 1.29.5 SSL Upstream Injection"
    description: "Version-based check: confirm the nginx version disclosed by the service falls in the affected range for CVE-2026-1642."
    steps:
      - title: "Fingerprint the nginx version with nmap"
        commands:
          - "nmap -Pn -sV -p <PORT> --script http-server-header,ssl-cert <TARGET>"
        notes: "Read the VERSION column and http-server-header output. Affected: nginx 1.3.0 through 1.28.1, and 1.29.0 through 1.29.4. Fixed: 1.28.2+ or 1.29.5+. ssl-cert confirms you hit the intended virtual host."

      - title: "Confirm the Server header directly"
        commands:
          - "curl -skI --max-time 15 -A \"Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0\" https://<TARGET>:<PORT>/"
        notes: "Look for 'Server: nginx/<version>'. Confirmed = version in the affected range. If the header is just 'nginx' (server_tokens off) or a CDN/proxy name (e.g. 'cloudflare'), the version cannot be confirmed remotely - mark unable, not false positive, and ask the client for the installed version. Distro packages may backport fixes without changing the version string; note this caveat in the report. This is a version check only - Nessus does not test exploitability."

      - title: "Check whether the version's release branch is still supported (endoflife.date)"
        commands:
          - "curl -s https://endoflife.date/api/nginx/<MAJOR.MINOR>.json"
          - "curl -s https://endoflife.date/api/nginx.json"
        notes: "Replace <MAJOR.MINOR> with the branch from steps 1-2 (e.g. 1.26 for 1.26.3). 'eol' is the date the branch stopped receiving fixes, or false if it is still supported; 'latest' is the last release on that branch. An 'eol' date in the past means the whole branch is unsupported: report it as Unsupported Software rather than Unpatched Software, and cite https://endoflife.date/nginx. The second command lists every branch, so you can see which ones are currently supported. Recommend upgrading to a supported branch, not just the plugin's fixed version - the fixed versions Nessus names can sit on branches that have since reached end of life."

    references:
      - "https://www.tenable.com/plugins/nessus/304671"
      - "https://nvd.nist.gov/vuln/detail/CVE-2026-1642"
      - "https://endoflife.date/nginx"

  # ---------------------------------------------------------------------------
  # Added from Cerno-verified nuclei findings (FieldNurse engagement, 2026-11).
  # ---------------------------------------------------------------------------

  - finding_id: "nuclei:http-missing-security-headers"
    workflow_name: "HTTP Missing Security Headers"
    description: "Confirm which security response headers are absent. The nuclei template fires one matcher per missing header, so verify every header it named, not just HSTS."
    steps:
      - title: "Pull the full response header set"
        commands:
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/"
        notes: "Compare against the matcher names in the nuclei output. Check for: Strict-Transport-Security, Content-Security-Policy, X-Frame-Options (or CSP frame-ancestors), X-Content-Type-Options, Referrer-Policy, Permissions-Policy, Cross-Origin-Opener-Policy, Cross-Origin-Embedder-Policy, Cross-Origin-Resource-Policy, X-Permitted-Cross-Domain-Policies. Each matcher whose header is absent = confirmed. Use GET, not -I: some servers and WAFs only add headers to GET responses. If the root redirects, also check the final landing page (add -L) and an authenticated page if one is in scope."

      - title: "Spot-check a second path and an API response"
        commands:
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/cerno-nonexistent-8f3a1c"
        notes: "Headers set by application code (not the web server or load balancer) often disappear on error pages and API endpoints. A header missing only on some responses is still worth reporting, with the affected paths named. Settle HSTS specifically with the 'HSTS Missing From HTTPS Server' workflow."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/misconfiguration/http-missing-security-headers.yaml"
      - "https://owasp.org/www-project-secure-headers/"

  - finding_id: "nuclei:weak-csp-detect"
    workflow_name: "Weak Content Security Policy"
    description: "Read the Content-Security-Policy header and decide whether it actually restricts script execution."
    steps:
      - title: "Extract the CSP header(s)"
        commands:
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/ | grep -iE '^content-security-policy(-report-only)?:'"
        notes: "Confirmed weak if any of: no default-src and no script-src (the policy gives no XSS protection, e.g. a CSP that is only 'frame-ancestors'); script-src or default-src containing 'unsafe-inline' (without a nonce/hash), 'unsafe-eval', '*', 'data:' or 'https:'; no object-src (falls back to default-src) or no base-uri. A Content-Security-Policy-Report-Only header enforces nothing. A policy with a strict script-src (nonces/hashes or 'self' only) plus object-src 'none' and base-uri = false positive."

      - title: "Optional: grade the policy"
        commands:
          - "Paste the policy into https://csp-evaluator.withgoogle.com/"
        notes: "Use the evaluator output as supporting evidence; do not paste customer-confidential policies into third-party sites without approval."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/misconfiguration/weak-csp-detect.yaml"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html"

  - finding_id: "nuclei:xss-deprecated-header"
    workflow_name: "Deprecated X-XSS-Protection Header"
    description: "Confirm the response still sends the deprecated X-XSS-Protection header."
    steps:
      - title: "Check for the X-XSS-Protection header"
        commands:
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/ | grep -i '^x-xss-protection'"
        notes: "Any value present = confirmed. '1; mode=block' or '1' is the case to report: modern browsers ignore the header, and in legacy browsers the XSS auditor it enables has been abused for cross-site information leaks. '0' is the recommended value if the header is kept at all. No output = false positive. Recommend removing it (or setting 0) and relying on a strict Content-Security-Policy instead."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/misconfiguration/xss-deprecated-header.yaml"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection"

  - finding_id: "nuclei:options-method"
    workflow_name: "Verify Advertised HTTP Methods and TRACE Handling"
    description: "Confirm which methods the server advertises via OPTIONS, then test whether TRACE is actually honored (Cross-Site Tracing)."
    steps:
      - title: "List advertised methods"
        commands:
          - "curl -sk --max-time 15 -i -X OPTIONS https://<TARGET>:<PORT>/"
        notes: "Check the Allow / Public response headers for the advertised methods. Note PUT, DELETE, TRACE, PROPFIND or other WebDAV verbs."

      - title: "Test whether TRACE echoes the request"
        commands:
          - "curl -sk --max-time 15 -i -X TRACE -H 'X-Trace-Test: cerno' https://<TARGET>:<PORT>/"
        notes: "Vulnerable (XST) only if the response is 200 with Content-Type message/http and the body echoes the request, including the X-Trace-Test header. A 405/501 response or no echo means TRACE is merely advertised (e.g. IIS returns 501) - report as informational at most. Test advertised PUT/DELETE separately and only against a harmless, tester-owned path."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/miscellaneous/options-method.yaml"
      - "https://owasp.org/www-community/attacks/Cross_Site_Tracing"

  - finding_id: "nuclei:swagger-api"
    workflow_name: "Public Swagger / OpenAPI Documentation"
    description: "Confirm the API documentation and machine-readable spec are retrievable without authentication, then use the spec to test whether the documented endpoints enforce authentication."
    steps:
      - title: "Retrieve the Swagger UI and common spec locations"
        commands:
          - "curl -sk --max-time 15 -o /dev/null -w '%{http_code} %{content_type} %{size_download} %{url}\\n' https://<TARGET>:<PORT>/swagger/index.html"
          - "curl -sk --max-time 15 -o /dev/null -w '%{http_code} %{content_type} %{size_download} %{url}\\n' https://<TARGET>:<PORT>/swagger/v1/swagger.json"
          - "curl -sk --max-time 15 -o /dev/null -w '%{http_code} %{content_type} %{size_download} %{url}\\n' https://<TARGET>:<PORT>/v2/api-docs"
          - "curl -sk --max-time 15 -o /dev/null -w '%{http_code} %{content_type} %{size_download} %{url}\\n' https://<TARGET>:<PORT>/openapi.json"
        notes: "Confirmed if a spec returns 200 with a JSON content type and a non-trivial size. The UI page alone (HTML) is weaker evidence - the spec URL is usually referenced in the page source. A catch-all site may return 200 for every path; compare against a random path before calling it."

      - title: "Summarize the spec"
        commands:
          - "curl -sk --max-time 30 https://<TARGET>:<PORT>/swagger/v1/swagger.json -o swagger.json"
          - "jq '{title: .info.title, version: .info.version, paths: (.paths | length), security: .security, schemes: .components.securitySchemes}' swagger.json"
          - "jq -r '.paths | to_entries[] | .key as $p | .value | keys[] | \"\\(ascii_upcase) \\($p)\"' swagger.json"
        notes: "Record the API title, path count and declared auth scheme. Flag sensitive operations for the report (admin, impersonation, user/patient/payment data, password reset, file upload/download)."

      - title: "Test documented GET endpoints without authentication"
        commands:
          - "jq -r '.paths | to_entries[] | select(.value.get) | .key' swagger.json | sed -E 's/\\{[^}]+\\}/1/g' | while read -r p; do curl -sk --max-time 15 -o /dev/null -w \"%{http_code} %{size_download} %{url}\\n\" \"https://<TARGET>:<PORT>$p\"; sleep 0.2; done"
        notes: "401/403 = auth enforced. 200 on an endpoint the spec marks as secured = authentication not enforced; fetch and review those bodies to judge sensitivity. Before running, remove any GET path whose name implies a state change (Delete, Disable, Enable, Reset, Update, Submit, Impersonate, Process, Remove, Send) - GETs are not always safe. Do not send POST/PUT/DELETE without explicit approval. Data exposed this way is often a separate, higher-severity finding than the Swagger exposure itself."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/exposures/apis/swagger-api.yaml"
      - "https://owasp.org/API-Security/editions/2023/en/0xa9-improper-inventory-management/"

  - finding_id: "nuclei:bigip-detect"
    workflow_name: "F5 BIG-IP Detection and Persistence Cookie Disclosure"
    description: "Confirm an F5 BIG-IP sits in front of the service and check whether its persistence cookie leaks internal pool member addresses."
    steps:
      - title: "Confirm the BIG-IP and capture its persistence cookie"
        commands:
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/ | grep -iE '^(set-cookie: *BIGipServer|server)'"
          - "curl -sk --max-time 15 -D - -o /dev/null https://<TARGET>:<PORT>/my.policy | grep -iE '^(HTTP|set-cookie|location)'"
        notes: "A BIGipServer<pool> cookie (or /my.policy answering for APM) confirms the BIG-IP. Inspect the cookie value: a plain numeric form such as 1677787402.36895.0000 (IPv4), a 'rd<N>o' route-domain form or a 'vi<hex>' IPv6 form is unencrypted and decodable. A value beginning with '!' is encrypted - no disclosure."

      - title: "Decode an unencrypted cookie"
        commands:
          - "nmap -Pn -p <PORT> --script http-bigip-cookie --script-args http-bigip-cookie.path=/ <TARGET>"
        notes: "The script prints the decoded internal IP:port when the cookie is unencrypted. No script output with a cookie present = encrypted or unrecognized format (informational only). A decoded RFC1918 address = reportable internal IP disclosure; recommend enabling cookie encryption on the persistence profile. Also check the BIG-IP version against current F5 advisories if a version leaks (e.g. via /tmui or APM pages) - but never touch /tmui management endpoints without approval."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/technologies/bigip-detect.yaml"
      - "https://nmap.org/nsedoc/scripts/http-bigip-cookie.html"
      - "https://my.f5.com/manage/s/article/K14784"

  - finding_id: "nuclei:ssl-issuer,nuclei:ssl-dns-names,nuclei:wildcard-tls"
    workflow_name: "TLS Certificate Review (Issuer, SANs, Wildcard)"
    description: "Pull the leaf certificate once to settle the certificate-inventory templates: issuer, subject alternative names, wildcard use and validity."
    steps:
      - title: "Dump the leaf certificate"
        commands:
          - "nmap -Pn -p <PORT> --script ssl-cert <TARGET>"
        notes: "Issuer: a public CA (DigiCert, Sectigo, Let's Encrypt, GlobalSign...) is expected; a self-signed or internal CA on an internet-facing service is reportable. SANs: list every DNS name as recon - additional hostnames may be new targets if they fall within scope. Wildcard: a '*.' subject or SAN confirms the wildcard template; it is informational, but note that one private key protects every matching host, so compromise of any host sharing the cert enables impersonation of all of them. Also record key type/size (flag RSA < 2048), signature algorithm (flag SHA-1/MD5) and the 'Not valid after' date (flag expired or expiring within ~30-60 days)."

      - title: "Optional: inspect the full chain"
        commands:
          - "sslscan --no-colour --show-certificates <TARGET>:<PORT>"
        notes: "Use when the issuer or chain looks wrong (missing intermediate, unexpected CA). Compare Subject and Issuer for each certificate in the chain."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/ssl/detect-ssl-issuer.yaml"
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/ssl/ssl-dns-names.yaml"
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/ssl/wildcard-tls.yaml"
      - "https://nmap.org/nsedoc/scripts/ssl-cert.html"

  - finding_id: "nuclei:azure-domain-tenant"
    workflow_name: "Microsoft Entra ID Tenant Discovery"
    description: "Confirm the customer's Entra ID tenant ID and build out identity reconnaissance from it. Steps 1-4 are passive OSINT against Microsoft's public endpoints and DNS, not against the target host; step 5 is active and needs explicit approval."
    steps:
      - title: "1. Confirm the tenant ID from the OpenID configuration"
        commands:
          - "curl -s --max-time 15 https://login.microsoftonline.com/<DOMAIN>/v2.0/.well-known/openid-configuration | jq -r '.issuer, .token_endpoint, .tenant_region_scope, .cloud_instance_name'"
        notes: "The GUID in the issuer URL is the tenant ID; confirmed if it matches the nuclei output. tenant_region_scope gives the region (e.g. NA, EU) and cloud_instance_name the cloud (microsoftonline.com = commercial; .us / .cn = government or sovereign clouds, which change the endpoints for later steps). This queries Microsoft, not the customer - confirm the ROE allows cloud/identity reconnaissance. A tenant ID is not a vulnerability; record it as recon."

      - title: "2. Identify the authentication type (managed vs federated)"
        commands:
          - "curl -s --max-time 15 \"https://login.microsoftonline.com/getuserrealm.srf?login=nonexistent@<DOMAIN>&xml=1\""
        notes: "Passive. NameSpaceType 'Managed' = cloud authentication (password hash sync or pass-through auth); Entra ID Smart Lockout applies. 'Federated' = authentication is redirected to an on-premises identity provider; AuthURL names that host (e.g. ADFS) and FederationBrandName the organisation. A federated IdP is a separate target with its own lockout policy and attack surface - add it only if the customer confirms it is in scope. 'Unknown' = the domain is not registered in Entra ID."

      - title: "3. Enumerate the tenant's verified domains and tenant settings"
        commands:
          - "Invoke-AADIntReconAsOutsider -DomainName <DOMAIN> | Format-Table"
        notes: "Passive (AADInternals PowerShell module; uses public Microsoft endpoints). Records the tenant brand name, the <name>.onmicrosoft.com default domain, every verified domain in the tenant, and per-domain DNS/MX/SPF/DMARC/STS/Desktop SSO status. Extra domains frequently reveal parent companies, subsidiaries or acquired brands - treat each one as a scope question for the customer, never as an automatic target. 'Desktop SSO' = Seamless SSO is enabled (relevant to later identity testing). Without PowerShell, Get-AADIntTenantDomains gives the domain list alone."

      - title: "4. Review email-authentication records for the domain"
        commands:
          - "dig +short MX <DOMAIN>"
          - "dig +short TXT <DOMAIN> | grep -i 'v=spf1'"
          - "dig +short TXT _dmarc.<DOMAIN>"
        notes: "Passive DNS lookups. An MX ending in mail.protection.outlook.com confirms Exchange Online. Flag a missing DMARC record, a DMARC policy of p=none (monitor only), or an SPF record ending in ~all (softfail) or +all / ?all, since these weaken spoofing protection - report them only if email security or social engineering is in scope. Repeat for each verified domain from step 3 that the customer confirms is in scope."

      - title: "5. Validate candidate usernames (ACTIVE - requires explicit ROE approval)"
        commands:
          - "curl -s --max-time 15 -X POST https://login.microsoftonline.com/common/GetCredentialType -H 'Content-Type: application/json' -d '{\"Username\":\"<USERNAME>@<DOMAIN>\"}' | jq '{IfExistsResult, ThrottleStatus, DesktopSso: .EstsProperties.DesktopSsoEnabled}'"
        notes: "Active: this interacts with the customer's identity configuration, so run it only when user enumeration is explicitly approved. IfExistsResult 0 = account exists, 1 = does not exist, 5/6 = exists in a different tenant or identity provider. ThrottleStatus 1 means Microsoft is throttling and results are unreliable - stop and slow down. Results are less reliable for federated domains (step 2). Keep volume low and pace requests. Build candidates from the email format seen in the application or public sources (e.g. first.last@<DOMAIN>). Valid usernames feed a separate, separately scoped identity test (password spraying, MFA coverage) that needs an agreed lockout threshold; do not spray from this workflow."

    references:
      - "https://github.com/projectdiscovery/nuclei-templates/blob/main/http/exposures/configs/azure-domain-tenant.yaml"
      - "https://learn.microsoft.com/en-us/entra/identity-platform/v2-protocols-oidc"
      - "https://aadinternals.com/aadinternals/"
      - "https://learn.microsoft.com/en-us/entra/identity/authentication/howto-password-smart-lockout"
      - "https://www.blackhillsinfosec.com/tag/azure/"
