[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerno"
version = "2.12.2"
description = "Modern CLI for Nessus findings review and security tool orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ridgeback InfoSec, LLC"}
]
keywords = ["nessus", "security", "penetration-testing", "vulnerability-scanning", "nmap", "netexec"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "rich>=14.3,<16",
    "typer>=0.27,<1",  # >=0.26 vendors Click, so suppressing `typer` covers it
    "shellingham>=1.5,<2",  # Required by typer for add_completion shell detection
    "pyperclip>=1.8,<2",
    "loguru>=0.7.3",
    "pyyaml>=6.0.0",
    "prompt_toolkit>=3.0",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "pytest-timeout>=2.4",
    "black>=26.3",  # Floor matters: Black's stable style changes across majors
    "mypy>=2.4,<3",  # Bounded: 2.0 flipped several defaults; cap avoids silent 3.x drift
    "pyright>=1.1.408",  # Type checking (complementary to mypy)
    "types-PyYAML>=6.0.12.20260906",  # Type stubs for pyyaml
]

[project.urls]
Homepage = "https://github.com/ridgebackinfosec/cerno"
Repository = "https://github.com/ridgebackinfosec/cerno"
Issues = "https://github.com/ridgebackinfosec/cerno/issues"

[project.scripts]
cerno = "cerno:app"

[tool.setuptools]
packages = ["cerno_pkg", "cerno_pkg.mcp_server"]
py-modules = ["cerno"]

[tool.setuptools.package-data]
cerno_pkg = ["*.yaml", "skills/*.md", "demo/*.nessus", "demo/nxc-workspace/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=cerno_pkg",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (database, filesystem)",
    "slow: Slow tests (large file processing)",
]
timeout = 300

[tool.coverage.run]
source = ["cerno_pkg"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
# No [[tool.mypy.overrides]] for tests.*: the checked paths are cerno.py and
# cerno_pkg/ only, and the override duplicated the global disallow_untyped_defs
# anyway, so warn_unused_configs reported it as dead.
